<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Management - Prayosha</title>
    <link rel="stylesheet" href="emp_style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { padding-top: 80px; padding-bottom: 80px; background-color: #f4f7f6; }
        .glass-panel-light { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 1.5rem; }
        .glass-input { background: rgba(248, 250, 252, 0.8); border: 1px solid rgba(226, 232, 240, 0.8); }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>
    <script src="emp_nav_components.js"></script>
    <script>
        const TASK_API_URL = "https://script.google.com/macros/s/AKfycbzOKLZzMoG4eAmdHBT0MeRIkQza3eq043oxr_Cs08_0OmSt8F0U-qUX0nmyUlpA13JtKw/exec";

        async function apiCall(action, payload = {}) {
            const projectId = localStorage.getItem('assignedProject') || 'PRYA-01'; 
            try {
                const response = await fetch(TASK_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, projectId: projectId, ...payload }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const rawText = await response.text(); 
                try {
                    return JSON.parse(rawText);
                } catch (parseError) {
                    alert(`🚨 PERMISSION BLOCK on [${action}]: Check Web App permissions.`);
                    return { success: false, message: "Permissions Error" };
                }
            } catch (err) {
                alert(`🚨 NETWORK ERROR on [${action}]: Cannot reach Apps Script.`);
                return { success: false, message: "Network Error" };
            }
        }
    </script>

    <div class="glass-panel-light p-6 md:p-8 max-w-6xl mx-auto relative shadow-sm mt-4" id="tasksModuleWrapper">
        <div id="tskFormOverlay" class="absolute inset-0 bg-white/50 backdrop-blur-sm z-50 flex items-center justify-center rounded-[1.25rem] font-black text-xl text-[#1E3A5F] flex-col gap-3">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-[#F59E0B]"></i> 
            <span>Syncing Database...</span>
        </div>

        <div class="flex gap-2 mb-8 border-b border-slate-200/50 pb-4 overflow-x-auto custom-scrollbar whitespace-nowrap">
            <button id="tabLog" class="tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-[#1E3A5F] text-white shadow-md">Log New Task</button>
            <button id="tabActive" class="tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition text-slate-500 hover:bg-white/50">Active</button>
            <button id="tabDelayed" class="tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition text-slate-500 hover:bg-white/50">Delayed</button>
            <button id="tabHistory" class="tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition text-slate-500 hover:bg-white/50">History</button>
            <button id="tabTimeline" class="tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition text-slate-500 hover:bg-white/50">Timeline</button>
            <button id="tabIssue" class="tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition text-slate-500 hover:bg-white/50">Raise Issue</button>
        </div>

        <!-- SECTION: LOG NEW TASK -->
        <div id="sectionLog" class="tab-section hidden animate-in fade-in">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Tower / Block</label>
                    <select id="taskPhase" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-[#F59E0B]"><option value="">-- Select --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Floor</label>
                    <select id="taskFloor" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-[#F59E0B]"><option value="">-- Select --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Unit Type (Category)</label>
                    <select id="taskCategory" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-[#F59E0B]"><option value="">-- Select --</option></select>
                </div>
            </div>
            
            <div class="mb-6 bg-blue-50/50 border border-blue-100 p-5 rounded-[1.25rem]">
                <label class="block text-[10px] font-extrabold text-blue-600 uppercase tracking-widest mb-2">Select Task / Checklist Point</label>
                <select id="taskChecklist" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-blue-900 outline-none bg-white"><option value="">-- Select Category First --</option></select>
            </div>

            <div class="mb-6">
                <label class="block text-[10px] font-extrabold text-[#1E3A5F] uppercase tracking-widest mb-2">Applicable Work Zones</label>
                <div id="taskZones" class="glass-input rounded-xl p-4 max-h-48 overflow-y-auto bg-white border border-slate-200">
                    <div class="text-sm font-bold text-slate-400 text-center">Select Tower, Floor, and Unit Type to view zones.</div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Assigned Agency</label>
                    <select id="taskAgency" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-[#F59E0B]"><option value="">-- Select Agency --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Initial Status</label>
                    <select id="taskStatus" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700 outline-none">
                        <option value="Not Started">Not Started</option>
                        <option value="On-Going">On-Going</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-8 pt-6 border-t border-slate-200 flex items-center justify-between">
                <div id="taskStatusMsg" class="font-bold text-sm"></div>
                <button id="submitTaskBtn" class="bg-[#1E3A5F] text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:bg-[#152943] transition flex items-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> Assign Task to Zones
                </button>
            </div>
        </div>

        <!-- SECTION: DYNAMIC ACCORDIONS & VIEWS -->
        <div id="sectionActive" class="tab-section hidden animate-in fade-in"><div id="activeTasksBody" class="space-y-3"></div></div>
        <div id="sectionDelayed" class="tab-section hidden animate-in fade-in"><div id="delayedTasksBody" class="space-y-3"></div></div>
        <div id="sectionHistory" class="tab-section hidden animate-in fade-in"><div id="historyTasksBody" class="space-y-3"></div></div>
        
        <div id="sectionTimeline" class="tab-section hidden animate-in fade-in">
            <div class="bg-white/40 p-6 rounded-[1.25rem] border border-slate-200/60 shadow-sm mb-6 max-w-4xl">
                <h3 class="text-sm font-black text-[#1E3A5F] uppercase tracking-widest mb-6 flex items-center gap-2">
                    <i data-lucide="clock" class="w-5 h-5 text-[#F59E0B]"></i> Zone History Timeline
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Tower / Block</label>
                        <select id="timelinePhase" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700 outline-none"><option value="">-- Select --</option></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Floor</label>
                        <select id="timelineFloor" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700 outline-none"><option value="">-- Select --</option></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-extrabold text-[#1E3A5F] uppercase tracking-widest mb-2">Select Zone</label>
                        <select id="timelineZone" class="glass-input w-full rounded-xl px-4 py-3 font-black text-[#1E3A5F] outline-none border border-blue-200 shadow-sm"><option value="">-- Select --</option></select>
                    </div>
                </div>
                <div class="border-t border-slate-200/60 pt-6 mt-6" id="timelineDataContainer">
                    <div class="text-center p-8 text-slate-400 font-bold">Please select a tower, floor, and zone to view its timeline history.</div>
                </div>
            </div>
        </div>

        <!-- SECTION: RAISE ISSUE -->
        <div id="sectionIssue" class="tab-section hidden animate-in fade-in">
            <div class="bg-rose-50/50 p-6 rounded-2xl border border-rose-100 mb-6 shadow-sm max-w-3xl">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-sm font-black text-rose-800 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="alert-triangle" class="w-4 h-4"></i> Report Issue / Blocker
                    </h3>
                </div>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Tower / Block</label>
                            <input type="text" id="issuePhase" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700" placeholder="e.g. Tower A">
                        </div>
                        <div>
                            <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Zone ID</label>
                            <input type="text" id="issueZone" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700" placeholder="e.g. Z-A-101">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Issue Description</label>
                        <textarea id="issueDesc" rows="3" class="glass-input w-full rounded-xl px-4 py-3 font-bold text-slate-700" placeholder="Describe the blocker in detail..."></textarea>
                    </div>
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-2">Upload Photo (Optional)</label>
                        <input type="file" id="issuePhoto" accept="image/*" class="w-full text-sm font-bold text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-rose-100 file:text-rose-700 cursor-pointer">
                    </div>
                </div>
                <div class="mt-6 pt-6 border-t border-rose-200/50 flex items-center justify-between">
                    <div id="issueStatusMsg" class="font-bold text-sm"></div>
                    <button id="submitIssueBtn" class="bg-rose-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-md hover:bg-rose-700 transition flex items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Submit Issue
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let siteHierarchy = {}; 
        let globalChecklists = {};
        let globalTasksData = null;

        document.addEventListener("DOMContentLoaded", () => {
            if (!localStorage.getItem('userToken')) window.location.href = 'emp_index.html';
            lucide.createIcons();
            
            const tabs = ['tabLog', 'tabActive', 'tabDelayed', 'tabHistory', 'tabTimeline', 'tabIssue'];
            const sections = ['sectionLog', 'sectionActive', 'sectionDelayed', 'sectionHistory', 'sectionTimeline', 'sectionIssue'];
            
            tabs.forEach((id, i) => {
                document.getElementById(id).onclick = () => {
                    // Completely hide all sections via classList
                    sections.forEach(sec => {
                        const el = document.getElementById(sec);
                        el.classList.add('hidden');
                        el.classList.remove('block');
                    });
                    
                    // Reset all tab button styles
                    tabs.forEach(tab => {
                        document.getElementById(tab).className = 'tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition text-slate-500 hover:bg-white/50';
                    });
                    
                    // Show active section
                    const activeSec = document.getElementById(sections[i]);
                    activeSec.classList.remove('hidden');
                    activeSec.classList.add('block');
                    
                    // Highlight active tab button
                    document.getElementById(id).className = 'tsk-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-[#1E3A5F] text-white shadow-md';
                    
                    // Fetch data if clicking a dynamic tab
                    if (['tabActive', 'tabDelayed', 'tabHistory', 'tabTimeline'].includes(id)) {
                        fetchTasksOverview();
                    }
                };
            });

            // Initialize the module and automatically click the first tab to render it
            initTaskModule();
            document.getElementById('tabLog').click();
        });

        function toggleAcc(id) {
            var el = document.getElementById(id);
            var chev = document.getElementById('chev_' + id);
            if(el) {
                if (el.classList.contains('hidden')) {
                    el.classList.remove('hidden');
                    if(chev) chev.classList.add('rotate-180');
                } else {
                    el.classList.add('hidden');
                    if(chev) chev.classList.remove('rotate-180');
                }
            }
        }

        async function fetchTasksOverview() {
            const res = await apiCall('getCategorizedTasksData');
            if (res.success) {
                globalTasksData = res.data;
                renderGroupedTasks(res.data.active, 'activeTasksBody', 'active');
                renderGroupedTasks(res.data.delayed, 'delayedTasksBody', 'delayed');
                renderGroupedTasks(res.data.history, 'historyTasksBody', 'history');
                
                var tlZone = document.getElementById('timelineZone');
                if (tlZone && tlZone.value) renderTimeline(tlZone.value);
            }
        }

        function getStatusStyle(status) {
            if(status === 'Completed') return "bg-emerald-100 text-emerald-700 border border-emerald-200";
            if(status === 'Delayed') return "bg-rose-100 text-rose-700 border border-rose-200";
            if(status === 'On-Going') return "bg-blue-100 text-blue-700 border border-blue-200";
            if(status === 'Ready for QC') return "bg-purple-100 text-purple-700 border border-purple-200";
            return "bg-slate-100 text-slate-700 border border-slate-200";
        }

        function buildCard(title, count, bodyHtml, targetId, icon, isTopLevel) {
            let bg = isTopLevel ? 'bg-white shadow-sm' : 'bg-slate-50/50';
            let headerBg = isTopLevel ? 'bg-white hover:bg-slate-50' : 'bg-slate-100/50 hover:bg-slate-200/50';
            let textClass = isTopLevel ? 'text-[#1E3A5F] text-sm' : 'text-slate-700 text-xs';
            
            return '<div class="border border-slate-200 rounded-xl mb-3 overflow-hidden ' + bg + '">' +
                     '<div class="px-5 py-4 cursor-pointer flex justify-between items-center transition ' + headerBg + '" onclick="toggleAcc(\'' + targetId + '\')">' +
                       '<div class="font-black uppercase tracking-wider ' + textClass + ' flex items-center gap-2">' +
                         '<i data-lucide="' + icon + '" class="w-4 h-4 text-blue-500"></i> ' + title +
                         '<span class="bg-blue-100 text-blue-700 py-0.5 px-2 rounded-md text-[10px] ml-2">' + count + '</span>' +
                       '</div>' +
                       '<i data-lucide="chevron-down" id="chev_' + targetId + '" class="w-4 h-4 text-slate-400 transition-transform duration-300"></i>' +
                     '</div>' +
                     '<div id="' + targetId + '" class="hidden p-0 border-t border-slate-200/60">' +
                       bodyHtml +
                     '</div>' +
                   '</div>';
        }

        function buildZoneTable(zones, type, tableId) {
             let html = '<div class="overflow-x-auto"><table class="w-full text-left whitespace-nowrap"><thead class="text-[10px] text-slate-400 font-extrabold uppercase tracking-widest border-b border-slate-200/50 bg-white/50">';
             
             if (type === 'active') {
                 html += '<tr><th class="px-4 py-3">ZONE / ID</th><th class="px-4 py-3">AGENCY</th><th class="px-4 py-3">LIVE STATUS</th><th class="px-4 py-3 text-right">ACTION</th></tr></thead><tbody id="' + tableId + '" class="divide-y divide-slate-100 bg-white">';
             } else if (type === 'delayed') {
                 html += '<tr><th class="px-4 py-3">ZONE / ID</th><th class="px-4 py-3">AGENCY</th><th class="px-4 py-3">REASON FOR DELAY</th></tr></thead><tbody class="divide-y divide-slate-100 bg-white">';
             } else if (type === 'history') {
                 html += '<tr><th class="px-4 py-3">ZONE / ID</th><th class="px-4 py-3">AGENCY</th><th class="px-4 py-3">ASSIGNED</th><th class="px-4 py-3">COMPLETED</th><th class="px-4 py-3 text-emerald-600">DAYS</th></tr></thead><tbody class="divide-y divide-slate-100 bg-white">';
             }

             zones.forEach(function(task) {
                 if(type === 'active') {
                     html += '<tr data-rownum="' + task.rowNumber + '" data-orig-status="' + task.status + '">';
                 } else {
                     html += '<tr>';
                 }
                 
                 html += '<td class="px-4 py-4 align-top"><strong class="text-[#1E3A5F]">' + task.zone + '</strong><br><span class="text-[10px] text-slate-400 font-mono bg-slate-50 px-2 py-0.5 rounded border border-slate-200 mt-1 inline-block">' + task.taskId + '</span></td>';

                 if (type === 'active') {
                     html += '<td class="px-4 py-4 align-top"><span class="text-xs text-[#F59E0B] font-black uppercase tracking-wider">' + task.agency + '</span></td>';
                     
                     html += '<td class="px-4 py-4 align-top"><div class="w-full min-w-[130px]"><select id="status_' + task.rowNumber + '" class="w-full rounded-full px-3 py-1.5 text-xs font-black outline-none cursor-pointer shadow-sm ' + getStatusStyle(task.status) + '" onchange="this.className=\'w-full rounded-full px-3 py-1.5 text-xs font-black outline-none cursor-pointer shadow-sm \' + getStatusStyle(this.value)">' +
                       '<option value="Not Started" ' + (task.status === 'Not Started' ? 'selected' : '') + '>Not Started</option>' +
                       '<option value="On-Going" ' + (task.status === 'On-Going' ? 'selected' : '') + '>On-Going</option>' +
                       '<option value="Ready for QC" ' + (task.status === 'Ready for QC' ? 'selected' : '') + '>Ready for QC</option>' +
                       '<option value="Completed" ' + (task.status === 'Completed' ? 'selected' : '') + '>Completed</option>' +
                       '<option value="Delayed" ' + (task.status === 'Delayed' ? 'selected' : '') + '>Delayed</option>' +
                     '</select></div></td>';
                     
                     html += '<td class="px-4 py-4 text-right align-top"><button type="button" onclick="saveTaskRow(this, \'' + task.rowNumber + '\')" class="bg-[#1E3A5F] text-white px-4 py-2 rounded-lg font-bold text-xs shadow-sm hover:bg-[#152943] transition">Save</button></td>';
                 } 
                 else if (type === 'delayed') {
                     html += '<td class="px-4 py-4 align-top"><span class="text-xs text-[#F59E0B] font-black uppercase tracking-wider">' + task.agency + '</span></td>';
                     html += '<td class="px-4 py-4 text-sm font-black text-rose-600 align-top">' + (task.delayedReason || 'No reason provided.') + '</td>';
                 }
                 else if (type === 'history') {
                     html += '<td class="px-4 py-4 align-top"><span class="text-xs text-[#F59E0B] font-black uppercase tracking-wider">' + task.agency + '</span></td>';
                     html += '<td class="px-4 py-4 text-sm font-bold text-slate-500 align-top">' + task.date + '</td><td class="px-4 py-4 text-sm font-bold text-slate-500 align-top">' + task.completedDate + '</td>';
                     let cBadge = task.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500';
                     html += '<td class="px-4 py-4 align-top"><span class="px-3 py-1 rounded-lg text-xs font-black ' + cBadge + '">' + task.daysTaken + '</span></td>';
                 }
                 html += '</tr>';
             });

             html += '</tbody></table></div>';
             return html;
        }

        function renderGroupedTasks(data, containerId, type) {
            var container = document.getElementById(containerId); 
            if (!container) return;
            if (!data || data.length === 0) { 
                container.innerHTML = '<div class="text-center py-10 text-slate-400 font-bold">No records found.</div>'; 
                return; 
            }

            var grouped = {};
            data.forEach(function(item) {
               let f = item.floor || 'Unknown Floor'; 
               let c = item.category || 'Unknown Category';
               let d = item.desc || 'Unknown Task';
               
               if(!grouped[f]) grouped[f] = {}; 
               if(!grouped[f][c]) grouped[f][c] = {};
               if(!grouped[f][c][d]) grouped[f][c][d] = []; 
               
               grouped[f][c][d].push(item);
            });

            let html = '';
            let fIdx = 0;
            
            for(let f in grouped) {
               fIdx++;
               let fId = 'acc_' + type + '_f_' + fIdx;
               let cHtml = '';
               let fCount = 0;
               
               for(let c in grouped[f]) {
                  let cId = fId + '_c_' + cHtml.length;
                  let tHtml = '';
                  let cCount = 0;
                  
                  for(let d in grouped[f][c]) {
                     let tId = cId + '_t_' + tHtml.length;
                     let zones = grouped[f][c][d] || [];
                     let tCount = zones.length;
                     cCount += tCount;
                     let tableHtml = buildZoneTable(zones, type, tId + '_tbl');
                     tHtml += buildCard(d, tCount, tableHtml, tId, 'check-square', false);
                  }
                  fCount += cCount;
                  cHtml += buildCard(c, cCount, tHtml, cId, 'grid', false);
               }
               html += buildCard(f, fCount, cHtml, fId, 'layers', true);
            }
            
            container.innerHTML = html;
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        function renderTimeline(zoneId) {
            var container = document.getElementById('timelineDataContainer');
            if (!zoneId || !globalTasksData || !globalTasksData.history) return;

            var tasks = globalTasksData.history.filter(t => t.zone === zoneId);
            if (tasks.length === 0) {
               container.innerHTML = '<div class="text-center p-8 text-slate-400 font-bold">No task history found for this zone.</div>';
               return;
            }

            var html = '<div class="relative border-l-[3px] border-slate-200 ml-4 space-y-8 pb-4">';
            tasks.forEach(t => {
               var dotColor = t.status === 'Completed' ? 'bg-emerald-500' : (t.status === 'Delayed' ? 'bg-rose-500' : 'bg-[#F59E0B]');
               html += `<div class="relative pl-8">
                  <div class="absolute w-4 h-4 rounded-full ${dotColor} -left-[9.5px] top-1.5 ring-4 ring-white shadow-sm"></div>
                  <div class="bg-white border border-slate-200 p-5 rounded-[1.25rem] shadow-sm">
                     <div class="flex justify-between items-center mb-2">
                        <h4 class="font-black text-[#1E3A5F]">${t.desc}</h4>
                        <span class="px-3 py-1 rounded-xl text-[10px] font-black uppercase ${getStatusStyle(t.status)}">${t.status}</span>
                     </div>
                     <p class="text-xs font-bold text-slate-500 mb-1">Agency: ${t.agency} | Assigned: ${t.date}</p>
                  </div>
               </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function initTaskModule() {
            const hierarchyRes = await apiCall('getZoneHierarchy');
            if (hierarchyRes.success) {
                siteHierarchy = hierarchyRes.data;
                const phaseSelect = document.getElementById('taskPhase');
                const tlPhaseSelect = document.getElementById('timelinePhase');
                const towers = Object.keys(siteHierarchy);
                
                if (towers.length > 0) {
                    towers.forEach(phase => {
                        phaseSelect.innerHTML += `<option value="${phase}">${phase}</option>`;
                        tlPhaseSelect.innerHTML += `<option value="${phase}">${phase}</option>`;
                    });
                }
            }

            const agenciesRes = await apiCall('getTaskAgencies');
            if (agenciesRes.success) {
                const agencySelect = document.getElementById('taskAgency');
                agenciesRes.data.forEach(ag => agencySelect.innerHTML += `<option value="${ag}">${ag}</option>`);
            }

            const checkRes = await apiCall('getChecklists');
            if (checkRes.success) {
                globalChecklists = checkRes.data;
            }

            document.getElementById('tskFormOverlay').style.display = 'none';
            setupCascadingDropdowns();
            setupTimelineDropdowns();
        }

        function setupTimelineDropdowns() {
            document.getElementById('timelinePhase').onchange = function() {
                const phase = this.value;
                const floorSelect = document.getElementById('timelineFloor');
                floorSelect.innerHTML = '<option value="">-- Select --</option>';
                if (phase && siteHierarchy[phase]) {
                    Object.keys(siteHierarchy[phase]).forEach(floor => floorSelect.innerHTML += `<option value="${floor}">${floor}</option>`);
                }
            };
            document.getElementById('timelineFloor').onchange = function() {
                const phase = document.getElementById('timelinePhase').value;
                const floor = this.value;
                const zoneSelect = document.getElementById('timelineZone');
                zoneSelect.innerHTML = '<option value="">-- Select --</option>';
                if (phase && floor && siteHierarchy[phase][floor]) {
                    Object.keys(siteHierarchy[phase][floor]).forEach(cat => {
                        siteHierarchy[phase][floor][cat].forEach(z => zoneSelect.innerHTML += `<option value="${z.id}">${z.label}</option>`);
                    });
                }
            };
            document.getElementById('timelineZone').onchange = function() { renderTimeline(this.value); };
        }

        function setupCascadingDropdowns() {
            document.getElementById('taskPhase').onchange = function() {
                const phase = this.value;
                const floorSelect = document.getElementById('taskFloor');
                floorSelect.innerHTML = '<option value="">-- Select --</option>';
                if (phase && siteHierarchy[phase]) {
                    Object.keys(siteHierarchy[phase]).forEach(floor => floorSelect.innerHTML += `<option value="${floor}">${floor}</option>`);
                }
            };

            document.getElementById('taskFloor').onchange = function() {
                const phase = document.getElementById('taskPhase').value;
                const floor = this.value;
                const catSelect = document.getElementById('taskCategory');
                catSelect.innerHTML = '<option value="">-- Select --</option>';
                if (phase && floor && siteHierarchy[phase][floor]) {
                    Object.keys(siteHierarchy[phase][floor]).forEach(cat => catSelect.innerHTML += `<option value="${cat}">${cat}</option>`);
                }
            };

            document.getElementById('taskCategory').onchange = function() {
                const phase = document.getElementById('taskPhase').value;
                const floor = document.getElementById('taskFloor').value;
                const cat = this.value;
                const zoneContainer = document.getElementById('taskZones');
                const taskDropdown = document.getElementById('taskChecklist');
                
                zoneContainer.innerHTML = '';
                taskDropdown.innerHTML = '<option value="">-- Select Task --</option>';

                if (phase && floor && cat && siteHierarchy[phase][floor][cat]) {
                    siteHierarchy[phase][floor][cat].forEach(zone => {
                        zoneContainer.innerHTML += `
                        <div class="flex items-center gap-3 mb-2 border-b border-slate-100 pb-2">
                            <input type="checkbox" name="taskZoneSelection" value="${zone.id}" class="w-4 h-4 rounded text-[#F59E0B]">
                            <label class="text-sm font-bold text-[#1E3A5F]">${zone.label}</label>
                        </div>`;
                    });

                    if (globalChecklists[cat]) {
                        globalChecklists[cat].forEach(t => taskDropdown.innerHTML += `<option value="${t}">${t}</option>`);
                    }
                }
            };

            document.getElementById('submitTaskBtn').onclick = async function() {
                const btn = this;
                const msg = document.getElementById('taskStatusMsg');
                const checked = Array.from(document.querySelectorAll('input[name="taskZoneSelection"]:checked')).map(cb => cb.value);
                
                const payload = {
                    phase: document.getElementById('taskPhase').value,
                    zoneIds: checked,
                    description: document.getElementById('taskChecklist').value,
                    agency: document.getElementById('taskAgency').value,
                    status: document.getElementById('taskStatus').value,
                    user: localStorage.getItem('userName') || 'Site Manager'
                };

                if (checked.length === 0 || !payload.description || !payload.agency) {
                    msg.innerHTML = '<span class="text-rose-500">Please complete all fields and select at least one zone.</span>';
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = 'Assigning...';
                
                const res = await apiCall('addCivilTask', payload);
                
                if (res.success) {
                    msg.innerHTML = `<span class="text-emerald-600">${res.message}</span>`;
                    document.querySelectorAll('input[name="taskZoneSelection"]').forEach(cb => cb.checked = false);
                } else {
                    msg.innerHTML = `<span class="text-rose-500">${res.message}</span>`;
                }
                
                btn.disabled = false;
                btn.innerHTML = 'Assign Task to Zones';
            };

            document.getElementById('submitIssueBtn').onclick = async function() {
                const btn = this;
                const msg = document.getElementById('issueStatusMsg');
                
                const payload = {
                    phase: document.getElementById('issuePhase').value,
                    zoneId: document.getElementById('issueZone').value,
                    description: document.getElementById('issueDesc').value,
                    reportedBy: localStorage.getItem('userName') || 'Site Manager',
                    photoBase64: null
                };

                if (!payload.zoneId || !payload.description) {
                    msg.innerHTML = '<span class="text-rose-500">Zone ID and Description required.</span>';
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = 'Submitting...';
                
                const res = await apiCall('raiseTaskIssue', payload);
                
                if (res.success) {
                    msg.innerHTML = `<span class="text-emerald-600">${res.message}</span>`;
                    document.getElementById('issueZone').value = '';
                    document.getElementById('issueDesc').value = '';
                } else {
                    msg.innerHTML = `<span class="text-rose-500">${res.message}</span>`;
                }
                
                btn.disabled = false;
                btn.innerHTML = 'Submit Issue';
            };
        }

        async function saveTaskRow(btn, rowNum) {
            const statusVal = document.getElementById('status_' + rowNum).value;
            btn.innerHTML = 'Saving...';
            btn.disabled = true;
            
            const res = await apiCall('updateBulkTasks', {
                updates: [{ rowNumber: rowNum, status: statusVal, delayedReason: '' }]
            });
            
            if (res.success) {
                btn.innerHTML = 'Saved';
                btn.className = 'bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-sm';
                setTimeout(() => fetchTasksOverview(), 1000);
            } else {
                alert('Error: ' + res.message);
                btn.innerHTML = 'Save';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
