<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Employee Workspace - Prayosha</title>
    <link rel="stylesheet" href="emp_style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- User Info Header -->
        <div class="user-card" style="margin-top: 10px;">
            <p><strong>Site Manager:</strong> <span id="display-name">Loading...</span></p>
            <p><strong>Project:</strong> <span id="display-project">Loading...</span></p>
        </div>

        <!-- Authorized Module Grid -->
        <div class="module-grid" id="moduleGrid">
            <a href="emp_project.html" class="module-card">
                <span class="card-icon">🏗️</span>
                <h3>Project Plans</h3>
            </a>
            <a href="emp_tasks.html" class="module-card">
                <span class="card-icon">📋</span>
                <h3>Task Update</h3>
            </a>
            <a href="emp_inventory.html" class="module-card">
                <span class="card-icon">🧱</span>
                <h3>Inventory</h3>
            </a>
            <a href="emp_workforce.html" class="module-card">
                <span class="card-icon">👷</span>
                <h3>Workforce</h3>
            </a>
            <a href="emp_purchase.html" class="module-card">
                <span class="card-icon">🛒</span>
                <h3>Purchases</h3>
            </a>
        </div>
    </div>

    <!-- Core Logic and Navigation -->
    <script src="emp_nav_components.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (!localStorage.getItem('userToken')) {
                window.location.href = 'emp_index.html';
                return;
            }
            document.getElementById('display-name').innerText = localStorage.getItem('userName') || "Unknown";
            document.getElementById('display-project').innerText = localStorage.getItem('assignedProject') || "Unknown";
        });
    </script>
</body>
</html>
