<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Details - Prayosha</title>
    <link rel="stylesheet" href="emp_style.css">
    <style>
        .project-header { background: #ffffff; padding: 20px; border-radius: 8px; border-left: 4px solid #f7a838; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .project-header img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; background: #eee; }
        .progress-bar-container { width: 100%; background: #e0e0e0; border-radius: 10px; height: 15px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: #f7a838; width: 0%; transition: width 0.5s; }
        .plan-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-plan { flex: 1; padding: 12px; background: #0A192F; color: #fff; text-align: center; text-decoration: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
        .btn-plan:hover { background: #f7a838; color: #000; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .detail-row span { color: #666; font-size: 0.9rem; }
        .detail-row strong { color: #111; font-size: 0.9rem; text-align: right;}
    </style>
</head>
<body>
    <div class="dashboard-container" id="projectContainer">
        <p style="text-align: center; margin-top: 20px; color: #666;" id="loadingText">Syncing Project Data...</p>
    </div>

    <script src="emp_nav_components.js"></script>
    <script>
        // Update this with the new Project_API deployment URL
        const PROJECT_API_URL = "https://script.google.com/macros/s/AKfycbwhLArH4Nj0WtqGQF8p-NII125jJOVq9DrPlzEHO4aOKJ2XhPXK2jF5GQ3qFuUuGQK1/exec";

        document.addEventListener("DOMContentLoaded", async () => {
            const assignedProject = localStorage.getItem('assignedProject');
            
            // Security check
            if (!localStorage.getItem('userToken')) {
                window.location.href = 'emp_index.html';
                return;
            }

            if (!assignedProject || assignedProject === 'All') {
                document.getElementById('projectContainer').innerHTML = `<div class="project-header"><h3>Select a specific project from the master list to view details. (Global view restricted for Site Managers)</h3></div>`;
                return;
            }

            try {
                const response = await fetch(PROJECT_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getProject', projectId: assignedProject }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const data = await response.json();

                if (data.status === 'success') {
                    renderProject(data.data);
                } else {
                    document.getElementById('loadingText').innerText = "Project not found or access denied.";
                }
            } catch (error) {
                document.getElementById('loadingText').innerText = "Offline Mode: Cannot fetch latest project details.";
            }
        });

        function renderProject(project) {
            const container = document.getElementById('projectContainer');
            
            // Only generate buttons if the Drive links exist in the database
            const plansHTML = `
                <div class="plan-buttons">
                    ${project.originalPlans ? `<a href="${project.originalPlans}" target="_blank" class="btn-plan">Original Plans</a>` : ''}
                    ${project.threeDPlans ? `<a href="${project.threeDPlans}" target="_blank" class="btn-plan">3D Plans</a>` : ''}
                </div>
            `;

            container.innerHTML = `
                <div class="project-header">
                    ${project.photo ? `<img src="${project.photo}" alt="Project Photo">` : `<div style="height:200px; background:#eee; margin-bottom:15px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#999;">No Photo Provided</div>`}
                    <h2>${project.name} (${project.code})</h2>
                    <p style="color: #666; font-size: 0.85rem; margin-bottom: 20px;">${project.address}</p>
                    
                    <div class="detail-row"><span>Status</span><strong>${project.status}</strong></div>
                    <div class="detail-row"><span>Start Date</span><strong>${project.startDate}</strong></div>
                    <div class="detail-row"><span>Est. End Date</span><strong>${project.endDate}</strong></div>
                    <div class="detail-row"><span>Total Area</span><strong>${project.sqft} SqFt</strong></div>

                    <p style="margin-top:20px; font-size:0.9rem; font-weight:bold;">Project Progress: ${project.progress}%</p>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${project.progress}%;"></div>
                    </div>
                    
                    ${plansHTML}
                </div>
            `;
        }
    </script>
</body>
</html>
